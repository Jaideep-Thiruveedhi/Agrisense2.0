[project]
name = "agrisense"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "sqlmodel>=0.0.22",
  "sqlalchemy>=2.0.31",
  "alembic>=1.13.2",
  "psycopg[binary]>=3.1.13",
  "pydantic>=2.8.2",
  "python-jose[cryptography]>=3.3.0",
  "firebase-admin>=6.5.0",
  "google-cloud-storage>=2.16.0",
  "httpx>=0.27.2",
  "google-genai>=0.8.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
science = [
  "xgboost>=2.0.0",
  "numpy>=1.26.0",
  "scipy>=1.13.0",
  "scikit-learn>=1.5.0",
  "shap>=0.44.0",
]
dev = [
  "pytest>=8.2.2",
  "pytest-asyncio>=0.23.7",
  "hypothesis>=6.100.0",
  "ruff>=0.5.5",
  "mypy>=1.10.0",
  "httpx>=0.27.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
