  /channels/push:
    post:
      security: [{ bearerAuth: [] }]
      responses: { 200: { description: ok } }
    delete:
      security: [{ bearerAuth: [] }]
      responses: { 200: { description: ok } }
  /catalog/crops:
    get:
      security: [{ bearerAuth: [] }]
      responses: { 200: { description: ok } }
  /catalog/products:
    get:
      security: [{ bearerAuth: [] }]
      responses: { 200: { description: ok } }
  /catalog/locations:
    get:
      security: [{ bearerAuth: [] }]
      responses: { 200: { description: ok } }
  /jobs/{id}:
    get:
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { 200: { description: ok } }
  /agronomist/summary:
    get:
      security: [{ bearerAuth: [] }]
      responses: { 200: { description: ok } }
  /agronomist/fields:
    get:
      security: [{ bearerAuth: [] }]
      responses: { 200: { description: ok } }
  /agronomist/stress-map:
    get:
      security: [{ bearerAuth: [] }]
      responses: { 200: { description: ok } }
  /agronomist/evidence:
    get:
      security: [{ bearerAuth: [] }]
      responses: { 200: { description: ok } }
  /agronomist/backtests:
    post:
      security: [{ bearerAuth: [] }]
