services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agrisense
      POSTGRES_USER: agrisense
      POSTGRES_PASSWORD: LOCAL_ONLY_PASSWORD
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  emulator:
    image: ghcr.io/firebase/firebase-tools:latest
    command: firebase emulators:start --only auth --host 0.0.0.0 --project demo-agrisense
    ports: ["9099:9099"]
    volumes: [./firebase.json:/home/node/firebase.json]
volumes:
  pgdata:
